<svg xmlns="http://www.w3.org/2000/svg" width="64" height="88" viewBox="0 0 64 88" role="img" aria-labelledby="title">
  <title id="title">HTML</title>
  <!-- Icon: Skill Icons, copyright (c) 2022 tandpfun, MIT. See LICENSE.skill-icons. -->
  <style>
    .spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: turn 10s ease-in-out 0s infinite;
    }
    .shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadow 10s ease-in-out 0s infinite;
    }
    @keyframes turn {
      0%, 70% { transform: perspective(180px) rotateY(0deg) rotateZ(0deg); }
      77.5% { transform: perspective(180px) rotateY(90deg) rotateZ(-4deg); }
      85% { transform: perspective(180px) rotateY(180deg) rotateZ(0deg); }
      92.5% { transform: perspective(180px) rotateY(270deg) rotateZ(4deg); }
      100% { transform: perspective(180px) rotateY(360deg) rotateZ(0deg); }
    }
    @keyframes shadow {
      0%, 70%, 85%, 100% { transform: scaleX(1); opacity: .3; }
      77.5%, 92.5% { transform: scaleX(.3); opacity: .15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .shadow { animation: none; transform: none; }
    }
  </style>
  <ellipse class="shadow" cx="32" cy="64" rx="19" ry="3" fill="#8250DF" opacity=".3"/>
  <g transform="translate(8 6)">
    <g class="spin">
