      <rect x=".5" y=".5" width="47" height="47" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity=".15"/>
    </g>
  </g>
  <rect x="0" y="70" width="64" height="18" rx="6" fill="#161927"/>
